e='selectOption(this)' data-id='i5_4'><div><div class='name'>Cerakote fire control group</div></div><div class='price' data-price>$125.00</div></label><label class='item' data-name='cerakote frame' data-base='125' data-tag=''><input type='checkbox' onchange='selectOption(this)' data-id='i5_5'><div><div class='name'>Cerakote Frame</div></div><div class='price' data-price>$125.00</div></label><label class='item' data-name='full tri-color cerakote fallout finish with nitre blue controls' data-base='650' data-tag=''><input type='checkbox' onchange='selectOption(this)' data-id='i5_6'><div><div class='name'>Full Tri-color cerakote fallout finish with nitre blue controls</div></div><div class='price' data-price>$650.00</div></label><label class='item' data-name='fully engraved and polished' data-base='1950' data-tag=''><input type='checkbox' onchange='selectOption(this)' data-id='i5_7'><div><div class='name'>Fully engraved and polished</div></div><div class='price' data-price>$1950.00</div></label><label class='item' data-name='24k gold plated controls' data-base='375' data-tag=''><input type='checkbox' onchange='selectOption(this)' data-id='i5_8'><div><div class='name'>24K gold plated controls</div></div><div class='price' data-price>$375.00</div></label></section></div></main><div class='totalbar'><div class='totalinner'><div><div class='count' id='count'>0 options selected</div><div class='total' id='total'>$0.00</div></div><div class='actions'><button onclick='openSummary()'>Save &amp; Share Build</button><button class='reset' id='reset' onclick='resetAll()'>Reset</button></div></div></div><div class='modal' id='summaryModal'><div class='modalbox'><div class='modalhead'><h2>Your Build</h2><button class='closebtn' onclick='closeSummary()'>Edit Build</button></div><p id='summaryPlatform'></p><div id='summaryList'></div><div class='summarytotal' id='summaryTotal'></div><div class='modalactions'><button onclick='copyBuild()'>Copy Build</button><button onclick='window.print()'>Print / Save PDF</button><button onclick='saveBuild()'>Save Build</button><button onclick='shareBuild()'>Share Build Link</button></div><div class='status' id='status'></div></div></div><script>
function money(n){return '$'+Number(n).toFixed(2);}
function selectOption(cb){
 if(cb&&cb.checked){var row=cb.closest?cb.closest('.item'):cb.parentNode;var group=row?row.getAttribute('data-group'):null;if(group){var others=document.querySelectorAll('.item[data-group=\"'+group+'\"] input[type=checkbox]');for(var i=0;i<others.length;i++){if(others[i]!==cb)others[i].checked=false;}}}
 recalc();
}
function recalc(){
 var rows=document.getElementsByClassName('item'),sum=0,count=0,plat=document.getElementById('platform').value;
 for(var i=0;i<rows.length;i++){
  var row=rows[i], cb=row.getElementsByTagName('input')[0], base=Number(row.getAttribute('data-base')), tag=row.getAttribute('data-tag')||'', add=(plat==='Girsan'&&(tag==='rearcut'||tag==='frontcut'))?25:0;
  var range=row.querySelector?row.querySelector('[data-range]'):null;
  var price=range?Number(range.value):base+add;
  if(!range){var pe=row.querySelector('[data-price]'); if(pe)pe.innerHTML=money(base+add);}
  if(cb&&cb.checked){sum+=price;count++;row.className='item selected';}else{row.className='item';}
 }
 document.getElementById('total').innerHTML=money(sum);
 document.getElementById('count').innerHTML=count+' option'+(count===1?'':'s')+' selected';
}
function resetAll(){var c=document.querySelectorAll('.item input[type=checkbox]');for(var i=0;i<c.length;i++)c[i].checked=false;recalc();}
function filterItems(){var q=document.getElementById('search').value.toLowerCase(),items=document.getElementsByClassName('item');for(var i=0;i<items.length;i++){var n=items[i].getAttribute('data-name')||'';items[i].style.display=n.indexOf(q)>=0?'':'none';}}

function selectedData(){
 var rows=document.getElementsByClassName('item'),out=[];
 for(var i=0;i<rows.length;i++){
  var row=rows[i],cb=row.querySelector('input[type=checkbox]'); if(!cb||!cb.checked)continue;
  var range=row.querySelector('[data-range]'),priceEl=row.querySelector('[data-price]');
  var price=range?Number(range.value):Number((priceEl.textContent||'').replace(/[^0-9.]/g,''));
  out.push({id:cb.getAttribute('data-id'),name:row.querySelector('.name').textContent,price:price,range:range?Number(range.value):null});
 }
 return out;
}
function openSummary(){
 var d=selectedData(),box=document.getElementById('summaryList');box.innerHTML='';
 document.getElementById('summaryPlatform').textContent='Pistol: '+document.getElementById('platform').options[document.getElementById('platform').selectedIndex].text;
 var sum=0;for(var i=0;i<d.length;i++){sum+=d[i].price;var r=document.createElement('div');r.className='summaryrow';r.innerHTML='<span>'+d[i].name+'</span><strong>'+money(d[i].price)+'</strong>';box.appendChild(r);}
 if(!d.length)box.innerHTML='<p>No build options selected.</p>';
 document.getElementById('summaryTotal').textContent='Total: '+money(sum);document.getElementById('status').textContent='';document.getElementById('summaryModal').className='modal open';
}
function closeSummary(){document.getElementById('summaryModal').className='modal';}
function buildText(){var d=selectedData(),sum=0,t='MK3 Hi-Power Build\nPistol: '+document.getElementById('platform').options[document.getElementById('platform').selectedIndex].text+'\n\n';for(var i=0;i<d.length;i++){sum+=d[i].price;t+='• '+d[i].name+' — '+money(d[i].price)+'\n';}return t+'\nTOTAL: '+money(sum);}
function copyBuild(){var t=buildText();if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){statusMsg('Build copied.');});}else{prompt('Copy this build:',t);}}
function currentState(){return {p:document.getElementById('platform').value,s:selectedData().map(function(x){return [x.id,x.range];})};}
function applyState(st){if(!st)return;document.getElementById('platform').value=st.p||'BHP';var checks=document.querySelectorAll('.item input[type=checkbox]');for(var i=0;i<checks.length;i++)checks[i].checked=false;for(var j=0;j<(st.s||[]).length;j++){var id=st.s[j][0],cb=document.querySelector('[data-id="'+id+'"]');if(cb){cb.checked=true;var rg=document.querySelector('[data-range="'+id+'"]');if(rg&&st.s[j][1]!=null)rg.value=st.s[j][1];}}recalc();}
function saveBuild(){try{localStorage.setItem('mk3Build',JSON.stringify(currentState()));statusMsg('Build saved on this device.');}catch(e){statusMsg('Could not save in this browser.');}}
function loadSaved(){try{var x=localStorage.getItem('mk3Build');if(x)applyState(JSON.parse(x));}catch(e){}}
function encodedState(){return btoa(unescape(encodeURIComponent(JSON.stringify(currentState())))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function shareBuild(){var url=location.origin+location.pathname+'?build='+encodedState();if(navigator.share){navigator.share({title:'MK3 Hi-Power Build',text:'My MK3 Hi-Power build',url:url}).catch(function(){});}else if(navigator.clipboard){navigator.clipboard.writeText(url).then(function(){statusMsg('Share link copied.');});}else{prompt('Copy this link:',url);}}
function loadFromURL(){var m=location.search.match(/[?&]build=([^&]+)/);if(!m)return false;try{var v=m[1].replace(/-/g,'+').replace(/_/g,'/');while(v.length%4)v+='=';applyState(JSON.parse(decodeURIComponent(escape(atob(v)))));return true;}catch(e){return false;}}
function statusMsg(x){document.getElementById('status').textContent=x;}

window.onload=function(){if(!loadFromURL())loadSaved();recalc();};
</script></body></html>
